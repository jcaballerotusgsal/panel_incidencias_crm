services:
  php:
    build:
      context: ./docker/php
    container_name: panel_CRM
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
  db:
    image: mysql:5.7.21
    platform: linux/amd64
    container_name: panel_CRM_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: panel_CRM
      MYSQL_USER: panel_CRM_user
      MYSQL_PASSWORD: panel_CRM_passwd
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data_mysql57:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
          "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  adminer:
    image: adminer
    container_name: panel_CRM_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    ports:
      - "8081:8080"
volumes:
  db_data_mysql57: